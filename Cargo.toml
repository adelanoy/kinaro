[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Alexandre Delanoy <al.delanoy@pm.me>"]
publish = false

[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/project",
    "crates/settings",
    "crates/assets",
    "crates/utils",
    "crates/workspace",
    "crates/editor",
    "crates/shared",
]
default-members = ["crates/app"]

[workspace.dependencies]
## Internals
ki_project = { path = "crates/project" }
ki_settings = { path = "crates/settings" }
ki_assets = { path = "crates/assets" }
ki_utils = {path = "crates/utils"}
ki_workspace = {path = "crates/workspace"}
ki_editor = {path = "crates/editor" }
ki_app_shared = {path = "crates/shared" }

gpui-kit = { version = "0.8", default-features = false, features = ["component"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "*", features = ["serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
dirs = "6.0"
log4rs = { version = "1", default-features = false, features = ["console_appender", "pattern_encoder", "file_appender"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
